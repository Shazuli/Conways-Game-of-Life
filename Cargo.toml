[package]
name = "conways_game_of_life_dyn_lib"
description = "Library for running Game of Life simulations."
version = "2.0.0-alpha"
readme = "README.md"
authors = ["Simon"]
keywords = ["game of life","game","lib","simulation"]
categories = ["simulation","games","mathematics","no-std"]
license = "MIT"
repository.workspace = true
edition.workspace = true
include = ["src/", "examples/", "Cargo.toml", "README.md", "!src/game_of_life_core/concurrency.rs"]
#exclude = ["src/game_of_life_core/concurrency.rs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = ["bench_features","test_features"]

[workspace.package]
edition = "2024"
repository = "https://github.com/Shazuli/Conways-Game-of-Life/tree/Rust_dyn"


[features]
default = ["rule_fns","step_single_thread"]
use_std = []
rule_fns = []
step_single_thread = []
debug = []
chunk_utilities = []
field_utilities = []
serde = ["dep:serde"]
concurrency = ["use_std"]


[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1


[[example]]
name = "cli_app_glider"
required-features = ["rule_fns","step_single_thread","field_utilities"]

[[example]]
name = "mwe_glider"
required-features = ["rule_fns","step_single_thread"]


[dependencies]
serde = { version = "1.0.219", default-features = false, features = ["alloc"], optional = true }
tinyvec = { version = "1.9.0", features = ["alloc"] }
#heapless = { version = "0.8.0", default-features = false }
#itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
#num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }


[dev-dependencies]
inline_colorization = "0.1.6"
rand = { version = "0.9.0" }